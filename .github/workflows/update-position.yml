name: Schiffsposition aktualisieren (manuell)
# Die regelmaessige Aktualisierung laeuft per Cronjob (scripts/run_and_push.sh).
# Dieser Workflow kann manuell als Fallback ausgefuehrt werden.
# Benoetigte Repository-Secrets: AISSTREAM_API_KEY, OPENWEATHER_API_KEY

on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Alle empfangenen AIS-Meldungen ausgeben'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Position per AIS und Wetter abrufen
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          AIS_DEBUG: ${{ inputs.debug && '1' || '' }}
        run: python scripts/fetch_position.py

      - name: Daten committen und pushen
        if: ${{ !cancelled() }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add data/position.json data/history.json
          for f in weather.json news.json; do
            [ -f "data/$f" ] && git add "data/$f" || true
          done
          if git diff --staged --quiet; then
            echo "Keine Änderungen – nichts zu committen."
          else
            git commit -m "data: Schiffsposition + Wetter $(date -u '+%Y-%m-%dT%H:%MZ')"
            git push origin HEAD:${{ github.ref_name }}
          fi
